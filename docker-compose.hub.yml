# VCall · 直接拉取 Docker Hub 镜像启动（数据目录 ./data）
# 用法：docker compose -f docker-compose.hub.yml up -d
name: vcall

services:
  vcall:
    image: kszyd/vcall-server:latest
    container_name: vcall
    restart: unless-stopped
    ports:
      - "9002:9002"                       # 管理后台 / 网页端 / 信令共用

    environment:
      # ---------- 管理后台 ----------
      VCALL_ADMIN_PASSWORD: "vcall@2026"                  # 登录密码，部署前请修改
      VCALL_ADMIN_SECRET: "please-change-this-secret"     # 令牌签名密钥，建议改成随机长串

      # ---------- 通话 ----------
      VCALL_MAX_CALL_MEMBERS: "6"         # 单次通话人数上限（2-12）
      VCALL_ANNOUNCEMENT: ""

      # ---------- 其它 ----------
      TZ: "Asia/Shanghai"

      # ---------- 可选：跨网段或公网时再取消注释 ----------
      # VCALL_TURN_URL: "turn:192.168.199.100:3478"
      # VCALL_TURN_USER: "vcall"
      # VCALL_TURN_PASS: "yourpass"

    volumes:
      - ./data:/data                      # 持久化设置

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
