name: Docker Image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kszyd/vcall-server
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name vcall-test -p 9002:9002 \
            -e VCALL_ADMIN_SECRET=test-secret kszyd/vcall-server:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9002/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9002/api/health
          curl -fsS http://127.0.0.1:9002/api/config
          docker logs vcall-test
          docker rm -f vcall-test
