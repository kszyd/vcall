# VCall 信令服务 · Docker Compose 部署（YAML）
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yaml up -d
# 访问：
#   http://192.168.199.100:9002/admin
# 说明：
#   - 所有配置直接写在本文件中，不使用 .env
#   - 数据目录为与本文件同级的 ./data
name: vcall

services:
  vcall:
    image: kszyd/vcall-server:latest
    container_name: vcall
    restart: unless-stopped
    ports:
      - "9002:9002"
      - "9443:9443"
    environment:
      VCALL_PORT: "9002"
      VCALL_DATA_DIR: "/data"
      VCALL_ADMIN_USER: "admin"
      VCALL_ADMIN_PASSWORD: "vcall@2026"
      VCALL_ADMIN_SECRET: "please-change-this-secret"
      VCALL_MAX_ROOM_MEMBERS: "2"
      VCALL_ANNOUNCEMENT: ""
      VCALL_LOG_LEVEL: "info"
      TZ: "Asia/Shanghai"
      # 跨网段/防火墙场景再填写，内网直连可留空
      VCALL_STUN_URLS: ""
      VCALL_TURN_URL: ""
      VCALL_TURN_USER: ""
      VCALL_TURN_PASS: ""
      # 可选 HTTPS：证书放到 ./certs 后填写容器内路径，浏览器端才能使用摄像头
      VCALL_TLS_PORT: "9443"
      VCALL_TLS_CERT: ""
      VCALL_TLS_KEY: ""
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
